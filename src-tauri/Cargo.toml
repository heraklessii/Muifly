[package]
name = "muifly"
version = "0.2.0"
description = "Windows icin oyun performans optimizasyon araci"
authors = ["Muifly"]
license = "LicenseRef-Muifly-EULA"
edition = "2021"
rust-version = "1.77.2"
publish = false
# Kare olcumu ayri bir ikilide (karar #27) ve cargo iki ikili uretiyor. Bunu
# soylemezsek "tauri build" ana ikiliyi degil YARDIMCIYI paketliyor: kurulum
# icinden muifly.exe cikmiyor. Sessiz bir hata, yalnizca kurulumu acan fark eder.
default-run = "muifly"

[lib]
name = "muifly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Demo ikilisi: `cargo build --features demo`. Kapsam ve gerekcesi
# docs/DISTRIBUTION.md'de, uygulanmasi src/surum.rs'de. Zaman sinirli deneme
# DEGIL - sinir ozellik seviyesinde.
demo = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
parking_lot = "0.12"

# Yalnizca Windows API cagrilari icin. Bu urun Windows'a ozel: sistem
# optimizasyonunun tamami platform API'lerine dayaniyor, capraz platform bir
# soyutlama katmani yazmak bos emek olurdu (bkz. docs/decisions.md #2).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Performance",
  "Win32_System_Time",
  "Win32_System_SystemServices",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Ikili boyutu onemli: bu program arka planda duran bir arac, kendisi sisiik
# olmamali. `panic = "abort"` YOK - bir optimizasyon panic ederse geri alma
# defterinin (ledger) calisabilmesi icin unwind sart.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
